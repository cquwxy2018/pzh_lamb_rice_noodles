# 在 GitHub 的 macOS runner 上构建 Mac 安装包（dmg）。
# 用法：把本仓库推送到 GitHub 后，到 Actions 页手动运行本 workflow（或打 tag 推送），
# 完成后在 Artifacts 下载 arm64 / x64 两个 dmg。无需自己拥有 Mac。
name: build-mac

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build dmg
        run: npx electron-builder --mac dmg --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error