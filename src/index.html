<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羊肉米线记账</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">羊</div>
        <div class="brand-text">
          <strong id="brandName">羊肉米线记账</strong>
          <span id="brandSub">小店经营与分红</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button type="button" class="nav-item is-active" data-tab="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"></rect></svg>
          <span>经营概览</span>
        </button>
        <button type="button" class="nav-item" data-tab="entry">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
          <span>记一笔</span>
        </button>
        <button type="button" class="nav-item" data-tab="records">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>
          <span>流水明细</span>
        </button>
        <button type="button" class="nav-item" data-tab="reports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15v3"></path><path d="M12 9v9"></path><path d="M17 5v13"></path></svg>
          <span>分红报表</span>
        </button>
        <button type="button" class="nav-item" data-tab="investors">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>股东与分红</span>
        </button>
        <button type="button" class="nav-item" data-tab="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
          <span>设置与备份</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="save-state">
          <span class="save-dot" id="saveDot"></span>
          <span id="saveText">数据仅保存在本机</span>
        </div>
        <div class="sidebar-tip">每日自动备份 · 可手动导出</div>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <div class="titles">
          <h1 id="pageTitle">经营概览</h1>
          <p id="pageSub">看清每天赚了多少、钱花在哪、股东能分多少</p>
        </div>
        <div class="range-wrap" id="rangeWrap">
          <div class="range-presets" id="rangePresets"></div>
          <div class="range-custom" id="rangeCustom">
            <input type="date" id="rangeStart" aria-label="开始日期">
            <span class="range-sep">至</span>
            <input type="date" id="rangeEnd" aria-label="结束日期">
            <button type="button" class="btn btn-ghost btn-sm" id="applyRange">应用</button>
          </div>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div id="modalRoot"></div>

  <script src="js/constants.js"></script>
  <script src="js/util.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
